# BS-2/BS-4: только overrides для @SpringBootTest.
# Postgres подаётся через Testcontainers (см. AbstractIntegrationTest); URL/user/password
# инъектируются через @DynamicPropertySource — здесь только то, что от профиля не зависит.
spring:
  jpa:
    open-in-view: false
  liquibase:
    contexts: production
  kafka:
    listener:
      auto-startup: false

logging:
  level:
    org.jooq: WARN
    org.testcontainers: INFO
